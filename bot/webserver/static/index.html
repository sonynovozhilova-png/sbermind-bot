<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sbermind — поддержка</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .header {
            background: #1a472a;
            color: white;
            padding: 20px 24px;
        }
        .header h1 { font-size: 20px; margin-bottom: 4px; }
        .header p { font-size: 13px; opacity: 0.8; }
        .chat {
            height: 400px;
            overflow-y: auto;
            padding: 20px 24px;
            background: #fafbfc;
        }
        .message {
            margin-bottom: 16px;
            display: flex;
        }
        .message.user { justify-content: flex-end; }
        .message .bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
        }
        .message.user .bubble {
            background: #1a472a;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.bot .bubble {
            background: white;
            color: #333;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 4px;
        }
        .input-area {
            padding: 16px 24px;
            border-top: 1px solid #e5e7eb;
            background: white;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: #1a472a; }
        button {
            padding: 12px 24px;
            background: #1a472a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #143a22; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .token-row {
            margin-bottom: 12px;
        }
        .token-row input {
            width: 100%;
            padding: 8px 12px;
            font-size: 12px;
            border: 1px dashed #d1d5db;
            border-radius: 8px;
        }
        .disclaimer {
            font-size: 11px;
            color: #6b7280;
            padding: 8px 24px 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Sbermind</h1>
            <p>Анонимный собеседник. Ничего не сохраняется.</p>
        </div>
        
        <div class="chat" id="chat">
            <div class="message bot">
                <div class="bubble">
                    Здравствуйте. Я здесь, чтобы выслушать. 
                    Что сегодня было самым тяжёлым?
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="token-row">
                <input type="text" id="token" placeholder="Код доступа (выдан HR)">
            </div>
            <div class="input-row">
                <input type="text" id="message" placeholder="Напишите сообщение..." 
                       onkeypress="if(event.key==='Enter') sendMessage()">
                <button id="sendBtn" onclick="sendMessage()">Отправить</button>
            </div>
        </div>
                <!-- Блок "Мост к человеку" -->
        <div style="padding: 0 24px 16px; text-align: center;">
            <button id="escalateBtn" onclick="escalateToHuman()" 
                    style="background: white; color: #1a472a; border: 1px solid #1a472a; padding: 10px 20px; border-radius: 10px; font-size: 13px; cursor: pointer; width: 100%; transition: all 0.2s;">
                🙋‍♀️ Хочу поговорить с живым специалистом
            </button>
        </div>
        <div class="disclaimer">
            Сообщения не сохраняются. Имена вырезаются перед обработкой.
        </div>
    </div>

    <script>
        let sessionId = null;
        const chatEl = document.getElementById('chat');
        const messageEl = document.getElementById('message');
        const tokenEl = document.getElementById('token');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = 'message ' + (isUser ? 'user' : 'bot');
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            div.appendChild(bubble);
            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        async function sendMessage() {
            const message = messageEl.value.trim();
            const token = tokenEl.value.trim();
            
            if (!message) return;
            if (!token) {
                alert('Введите код доступа');
                return;
            }

            addMessage(message, true);
            messageEl.value = '';
            sendBtn.disabled = true;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId
                    })
                });

                if (response.status === 401) {
                    addMessage('Неверный код доступа.', false);
                    return;
                }

                if (!response.ok) {
                    addMessage('Сервис временно недоступен. Попробуйте позже.', false);
                    return;
                }

                const data = await response.json();
                sessionId = data.session_id;
                addMessage(data.response, false);
            } catch (e) {
                addMessage('Ошибка соединения. Проверьте интернет.', false);
            } finally {
                sendBtn.disabled = false;
                messageEl.focus();
            }
        }
                async function escalateToHuman() {
            const token = tokenEl.value.trim();
            if (!token) {
                alert('Сначала введите код доступа.');
                return;
            }

            // Меняем текст кнопки, показывая, что идет запрос
            const btn = document.getElementById('escalateBtn');
            btn.disabled = true;
            btn.innerText = 'Соединяем...';
            addMessage("Я хочу поговорить с живым специалистом.", true);

            try {
                const response = await fetch('/escalate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        message: "Запрос на эскалацию" 
                    })
                });

                const data = await response.json();
                
                // Выводим контакты в чат
                const contactText = `Хорошо. Я — искусственный интеллект, и в сложных ситуациях лучше поговорить с человеком.\n\n` +
                                    `📞 ${data.contacts.phone}\n` +
                                    `💬 Telegram: ${data.contacts.telegram}\n\n` +
                                    `${data.contacts.note}`;
                
                addMessage(contactText, false);

            } catch (e) {
                addMessage('Ошибка соединения. Попробуйте позже.', false);
            } finally {
                // Возвращаем кнопку в исходное состояние
                btn.disabled = false;
                btn.innerText = '🙋‍♀️ Хочу поговорить с живым специалистом';
            }
        }
    </script>
</body>
</html>
